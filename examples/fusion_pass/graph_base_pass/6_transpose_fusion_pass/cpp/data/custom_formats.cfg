# =============================================================
# custom_formats.cfg - GraphNodeSettedFormatPass 配置文件
# =============================================================
# 格式说明：
#   1. 以 [节点名] 定义 section（方括号中的字符串为图中节点的名称 node_name）
#   2. input.<index>=<Format> 配置第 index 号输入的格式
#   3. output.<index>=<Format> 配置第 index 号输出的格式
#   4. # 开头的行和空白行会被忽略
#
# Format 支持的值（参考 ge::Format 枚举）：
#   FORMAT_ND, FORMAT_NCHW, FORMAT_NHWC, FORMAT_HWCN, FORMAT_CHWN,
#   FORMAT_NC1HWC0, FORMAT_NC1HWC0_C04, FORMAT_FRACTAL_Z, FORMAT_FRACTAL_NZ,
#   FORMAT_FRACTAL_Z_C04, FORMAT_NC1C0HWPACK,
#   FORMAT_NDHWC, FORMAT_NCDHW, FORMAT_DHWCN, FORMAT_DHWNC,
#   FORMAT_FRACTAL_Z_3D, FORMAT_NDC1HWC0, FORMAT_FRACTAL_Z_3D_TRANSPOSE
# =============================================================

# 示例：将名为 conv1 的节点的输出格式改为 NHWC
[conv1]
output.0=FORMAT_NHWC
output.1=FORMAT_NHWC

# 示例：将名为 matmul_custom 的节点的输入输出格式改为 FORMAT_NHWC
[matmul_custom]
input.0=FORMAT_NHWC
input.1=FORMAT_NHWC
output.0=FORMAT_NHWC

# 示例：将名为 relu1 的节点的输入输出改为 NCHW
[relu1]
input.0=FORMAT_NCHW
output.0=FORMAT_NCHW

# 示例：将名为 batch_matmul_0 的节点的输入改为 NCHW 格式
[batch_matmul_0]
input.0=FORMAT_NCHW
input.1=FORMAT_NCHW
output.0=FORMAT_NCHW
