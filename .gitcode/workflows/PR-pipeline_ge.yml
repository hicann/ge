        if: env.TARGET_BRANCH == 'master' || env.TARGET_BRANCH == 'develop'
        runs-on: ['self-hosted', 'arch=x64', 'spec=small']
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ jobs.JOB_image.outputs.UT_Test_Report }}
      JOB_ST_Report_graphengine:
        name: ST_Report_graphengine
        select: selected_by_default
        needs: []
        steps:
          -
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              token: ${{secrets.GIT_TOKEN}}
          -
            name: download
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              key: |
                ${{ env.obs_path }}/pr_filelist.txt
                ${{ env.obs_path }}/pr_filelist_mod.txt
              path: ${{ steps.process_checkout.outputs.path }}
          -
            name: ST_Report_graphengine
            identifier: ut-report
            uses: cann/.gitcode/actions/ut-cov-report@master
            with:
              workspace: ${{ steps.process_checkout.outputs.path }}
              cov_mode: "report"
              ut_field: "graphengine"
              modules: "st_dflow st_ge_common st_parser st_rt st_acl st_hetero st_ge_common_atc"
              source_branch: ${{ env.SOURCE_BRANCH }}
              target_branch: ${{ env.TARGET_BRANCH }}
              obs_path: ${{ env.obs_path }}
              git_token: ${{secrets.GIT_TOKEN}}
          -
            name: rename
            run: |
              if [ -f "${{ steps.process_checkout.outputs.path }}/ut_cov_graphengine.tar.gz" ]; then
                mv ${{ steps.process_checkout.outputs.path }}/ut_cov_graphengine.tar.gz ${{ steps.process_checkout.outputs.path }}/st_cov_graphengine.tar.gz
              else
                echo "Coverage file not found, skipping rename"
              fi
          -
            name: upload
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{secrets.AK}}
              secret-key: ${{secrets.SK}}
              artifact-path: |
                ${{ steps.process_checkout.outputs.path }}/st_cov_*.tar.gz
              object-prefix: ${{ env.obs_path }}/
        if: env.TARGET_BRANCH == 'master' || env.TARGET_BRANCH == 'develop'
        runs-on: ['self-hosted', 'arch=x64', 'spec=small']
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ jobs.JOB_image.outputs.ST_Test_Report }}
      JOB_ST_Report_ge_executor_c:
        name: ST_Report_executor
        select: selected_by_default
        needs: []
        steps:
          -
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
