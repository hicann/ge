name: PR-pipeline_ge

concurrency:
  max: 5
  exceed-action: QUEUE
  enable: true
  preemption:
    enable: true
    events: [mr_id]

on:
  pull_request_comment:
    types: [created]
    branches: [ '*' ]
    comments: [ '^(?:\/)?compile*' ]
  pr_comment:
      types: [ created ]
      keyword: '^(?:\/)?compile*'

env:
  org_name: "cann"
  repo_name: "ge"
  MERGE_ID: ${{atomgit.event.pull_request.number}}
  TARGET_BRANCH: ${{atomgit.ref_name}}
  SOURCE_BRANCH: ${{atomgit.head_ref}}
  obs_path: "test/ge/package/${{ env.MERGE_ID }}"
  obs_smoke_path: "presmoke/${{ env.repo_name }}/2/${{ env.MERGE_ID }}"

stages:
  stage1:
    name: PreBuild
    jobs:
      JOB_image:
        name: Test_image
        steps:
          - name: revise_image
            identifier: revise_image
            uses: cann/.gitcode/actions/revise-img@master
            with:
              repo_name: "ge"
              target_branch: ${{ env.TARGET_BRANCH }}
              repo_url: ${{ vars.CI_PATH }}
          - name: show_output
            run: |
              echo "image: ${{ steps.revise_image.outputs.Compile_Ascend_X86 }}"
        if: "${{ default() }}"
        runs-on: ["dedicate-hosted", "x64", "small"]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
      JOB_pr:
        name: Test_get_pr
        steps:
          - name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              token: ${{secrets.GIT_TOKEN}}
          - name: get_pr
            identifier: get_pr
            uses: cann/.gitcode/actions/get-pr@master
            with:
              workspace: ${{ steps.process_checkout.outputs.path }}
              target_branch: ${{ env.TARGET_BRANCH }}
              owner: ${{ env.org_name }}
              repo: ${{ env.repo_name }}
              pr_number: ${{ atomgit.event.pull_request.number }}
              git_token: ${{secrets.GIT_TOKEN}}
          - name: upload
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{secrets.AK}}
              secret-key: ${{secrets.SK}}
              artifact-path: |
                ${{ steps.process_checkout.outputs.path }}/pr_filelist.txt
                ${{ steps.process_checkout.outputs.path }}/pr_filelist_mod.txt
                ${{ steps.process_checkout.outputs.path }}/pr_filelist_precommit.txt
                ${{ steps.process_checkout.outputs.path }}/update_file_detail.txt
              object-prefix: ${{ env.obs_path }}/
        runs-on:
          - default
      JOB_shell:
        name: Test_get_shell_files
        steps:
          -
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: master
              token: ${{secrets.GIT_TOKEN}}
          -
            name: upload
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{secrets.AK}}
              secret-key: ${{secrets.SK}}
              artifact-path: |
                ${{ steps.process_checkout.outputs.path }}/.gitcode/scripts/*
              object-prefix: ${{ env.obs_path }}/
        if: "${{ default() }}"
        runs-on:
          - default
    pre:
      - type: auto
    fail-fast: true

  stage2:
    name: compile
    jobs:
      # ==================== Code Check ====================
      JOB_CodeCheck_action:
        name: CodeCheck
        uses: .gitcode/workflows/codecheck_action.yml
        with:
          precommit_image_version: ${{ jobs.JOB_image.outputs.precommit }}
          codecheck_image_version: ${{ jobs.JOB_image.outputs.codecheck }}
          org: ${{ env.org_name }}
          pr_number: ${{ env.MERGE_ID }}
          repo_name: ${{ env.repo_name }}
          commit_id: ${{ atomgit.event.pull_request.merge_commit_sha }}

      # ==================== X86 Compile ====================
      JOB_x86_compiler_ubuntu24:
        name: Compile_X86_compiler_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_X86_compiler_ubuntu24'
          image_version: ${{ jobs.JOB_image.outputs.Compile_X86_compiler_ubuntu24 }}
          arch: 'x64'

      JOB_x86_executor_ubuntu24:
        name: Compile_X86_executor_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_X86_executor_ubuntu24'
          image_version: ${{ jobs.JOB_image.outputs.Compile_X86_executor_ubuntu24 }}
          arch: 'x64'

      JOB_x86_dflow_ubuntu24:
        name: Compile_X86_dflow_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_X86_dflow_ubuntu24'
          image_version: ${{ jobs.JOB_image.outputs.Compile_X86_dflow_ubuntu24 }}
          arch: 'x64'

      JOB_x86_compiler:
        name: Compile_X86_compiler
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_X86_compiler'
          image_version: ${{ jobs.JOB_image.outputs.Compile_X86_compiler }}
          arch: 'x64'

      JOB_x86_executor:
        name: Compile_X86_executor
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_X86_executor'
          image_version: ${{ jobs.JOB_image.outputs.Compile_X86_executor }}
          arch: 'x64'

      JOB_x86_dflow:
        name: Compile_X86_dflow
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_X86_dflow'
          image_version: ${{ jobs.JOB_image.outputs.Compile_X86_dflow }}
          arch: 'x64'

      # ==================== ARM Compile ====================
      JOB_arm_compiler:
        name: Compile_ARM_compiler
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_ARM_compiler'
          image_version: ${{ jobs.JOB_image.outputs.Compile_ARM_compiler }}
          arch: 'arm64'

      JOB_arm_executor:
        name: Compile_ARM_executor
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_ARM_executor'
          image_version: ${{ jobs.JOB_image.outputs.Compile_ARM_executor }}
          arch: 'arm64'

      JOB_arm_dflow:
        name: Compile_ARM_dflow
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_ARM_dflow'
          image_version: ${{ jobs.JOB_image.outputs.Compile_ARM_dflow }}
          arch: 'arm64'

      JOB_arm_compiler_ubuntu24:
        name: Compile_ARM_compiler_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_ARM_compiler_ubuntu24'
          image_version: ${{ jobs.JOB_image.outputs.Compile_ARM_compiler_ubuntu24 }}
          arch: 'arm64'

      JOB_arm_executor_ubuntu24:
        name: Compile_ARM_executor_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_ARM_executor_ubuntu24'
          image_version: ${{ jobs.JOB_image.outputs.Compile_ARM_executor_ubuntu24 }}
          arch: 'arm64'

      JOB_arm_dflow_ubuntu24:
        name: Compile_ARM_dflow_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_ARM_dflow_ubuntu24'
          image_version: ${{ jobs.JOB_image.outputs.Compile_ARM_dflow_ubuntu24 }}
          arch: 'arm64'

      # ==================== Static Checks ====================
      # JOB_CodeCheck_staticcheck_markdown:
      #   name: CodeCheck_staticcheck_markdown
      #   uses: .gitcode/workflows/staticcheck_action.yml
      #   with:
      #     check_type: 'markdown'
      #     image_version: ${{ jobs.JOB_image.outputs.staticcheck }}

      # JOB_CodeCheck_staticcheck_codespell_check:
      #   name: CodeCheck_staticcheck_codespell_check
      #   uses: .gitcode/workflows/staticcheck_action.yml
      #   with:
      #     check_type: 'codespell_check'
      #     image_version: ${{ jobs.JOB_image.outputs.staticcheck }}

      # JOB_CodeCheck_staticcheck_tag_closed_check:
      #   name: CodeCheck_staticcheck_tag_closed_check
      #   uses: .gitcode/workflows/staticcheck_action.yml
      #   with:
      #     check_type: 'tag_closed_check'
      #     image_version: ${{ jobs.JOB_image.outputs.staticcheck }}

      # JOB_CodeCheck_staticcheck_resource_existence_check:
      #   name: CodeCheck_staticcheck_resource_existence_check
      #   uses: .gitcode/workflows/staticcheck_action.yml
      #   with:
      #     check_type: 'resource_existence_check'
      #     image_version: ${{ jobs.JOB_image.outputs.staticcheck }}

      # JOB_CodeCheck_staticcheck_link_validity_check:
      #   name: CodeCheck_staticcheck_link_validity_check
      #   uses: .gitcode/workflows/staticcheck_action.yml
      #   with:
      #     check_type: 'link_validity_check'
      #     image_version: ${{ jobs.JOB_image.outputs.staticcheck }}

    pre:
      - type: auto
    fail-fast: false

  stage3:
    name: LLT
    jobs:
      # ==================== UT Tests ====================
      JOB_UT_Test_dflow:
        name: UT_Test_dflow
        uses: .gitcode/workflows/ut_action.yml
        with:
          ut_type: 'dflow'
          ut_package: 'coverage_ut_*.info'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_dflow }}

      JOB_UT_Test_ge_common:
        name: UT_Test_ge_common
        uses: .gitcode/workflows/ut_action.yml
        with:
          ut_type: 'ge_common'
          ut_package: 'coverage_ut_*.info'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_ge_common }}

      JOB_UT_Test_parser:
        name: UT_Test_parser
        uses: .gitcode/workflows/ut_action.yml
        with:
          ut_type: 'parser'
          ut_package: 'coverage_ut_*.info'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_parser }}

      JOB_UT_Test_python:
        name: UT_Test_python
        uses: .gitcode/workflows/ut_action.yml
        with:
          ut_type: 'python'
          ut_package: 'coverage_ut_*.info'
          language: 'python'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_python }}

      JOB_UT_Test_rt:
        name: UT_Test_rt
        uses: .gitcode/workflows/ut_action.yml
        with:
          ut_type: 'rt'
          ut_package: 'coverage_ut_*.info'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_rt }}

      JOB_UT_Test_ge_acl:
        name: UT_Test_ge_acl
        uses: .gitcode/workflows/ut_action.yml
        with:
          ut_type: 'acl'
          ut_package: 'coverage_ut_*.info'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_acl }}

      JOB_UT_Test_autofuse:
        name: UT_Test_autofuse
        uses: .gitcode/workflows/ut_action.yml
        with:
          ut_type: 'autofuse_framework'
          ut_package: 'coverage_ut_*.info'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_autofuse }}

      JOB_UT_Test_executor:
        name: UT_Test_executor
        uses: .gitcode/workflows/ut_action.yml
        with:
          ut_type: 'executor_c'
          ut_package: 'coverage_ut_*.info'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_executor }}

      JOB_UT_Test_autofuse_ascendc_api:
        name: UT_Test_autofuse_ascendc_api
        uses: .gitcode/workflows/ut_action.yml
        with:
          ut_type: 'autofuse_ascendc_api'
          ut_package: 'coverage_ut_*.info'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_autofuse_ascendc_api }}

      JOB_UT_Test_fe:
        name: UT_Test_fe
        uses: .gitcode/workflows/ut_action.yml
        with:
          ut_type: 'fe'
          ut_package: 'coverage_ut_*.info'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_fe }}

      JOB_UT_Test_tefusion:
        name: UT_Test_tefusion
        uses: .gitcode/workflows/ut_action.yml
        with:
          ut_type: 'tefusion'
          ut_package: 'coverage_ut_*.info'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_tefusion }}

      # ==================== ST Tests ====================
      JOB_ST_Test_dflow:
        name: ST_Test_dflow
        uses: .gitcode/workflows/st_action.yml
        with:
          st_type: 'dflow'
          st_package: 'coverage_st_*.info'
          image_version: ${{ jobs.JOB_image.outputs.ST_Test_dflow }}

      JOB_ST_Test_ge_common:
        name: ST_Test_ge_common
        uses: .gitcode/workflows/st_action.yml
        with:
          st_type: 'ge_common'
          st_package: 'coverage_st_*.info'
          image_version: ${{ jobs.JOB_image.outputs.ST_Test_ge_common }}

      JOB_ST_Test_parser:
        name: ST_Test_parser
        uses: .gitcode/workflows/st_action.yml
        with:
          st_type: 'parser'
          st_package: 'coverage_st_*.info'
          image_version: ${{ jobs.JOB_image.outputs.ST_Test_parser }}

      JOB_ST_Test_python:
        name: ST_Test_python
        uses: .gitcode/workflows/st_action.yml
        with:
          st_type: 'python'
          st_package: 'coverage_st_*.info'
          language: 'python'
          image_version: ${{ jobs.JOB_image.outputs.ST_Test_python }}

      JOB_ST_Test_rt:
        name: ST_Test_rt
        uses: .gitcode/workflows/st_action.yml
        with:
          st_type: 'rt'
          st_package: 'coverage_st_*.info'
          image_version: ${{ jobs.JOB_image.outputs.ST_Test_rt }}

      JOB_ST_Test_autofuse:
        name: ST_Test_autofuse
        uses: .gitcode/workflows/st_action.yml
        with:
          st_type: 'autofuse_framework'
          st_package: 'coverage_st_*.info'
          image_version: ${{ jobs.JOB_image.outputs.ST_Test_autofuse }}

      JOB_ST_Test_executor:
        name: ST_Test_executor
        uses: .gitcode/workflows/st_action.yml
        with:
          st_type: 'executor_c'
          st_package: 'coverage_st_*.info'
          image_version: ${{ jobs.JOB_image.outputs.ST_Test_executor }}

      JOB_ST_Test_hetero:
        name: ST_Test_hetero
        uses: .gitcode/workflows/st_action.yml
        with:
          st_type: 'hetero'
          st_package: 'coverage_st_*.info'
          image_version: ${{ jobs.JOB_image.outputs.ST_Test_hetero }}

      JOB_ST_Test_autofuse_ascendc_api:
        name: ST_Test_autofuse_ascendc_api
        uses: .gitcode/workflows/st_action.yml
        with:
          st_type: 'autofuse_ascendc_api'
          st_package: 'coverage_st_*.info'
          image_version: ${{ jobs.JOB_image.outputs.ST_Test_autofuse_ascendc_api }}

      JOB_ST_Test_autofuse_e2e:
        name: ST_Test_autofuse_e2e
        uses: .gitcode/workflows/st_action.yml
        with:
          st_type: 'autofuse_e2e'
          st_package: 'coverage_st_*.info'
          image_version: ${{ jobs.JOB_image.outputs.ST_Test_autofuse }}

      JOB_ST_Test_fe:
        name: ST_Test_fe
        uses: .gitcode/workflows/st_action.yml
        with:
          st_type: 'fe'
          st_package: 'coverage_st_*.info'
          image_version: ${{ jobs.JOB_image.outputs.ST_Test_fe }}

      JOB_ST_Test_tefusion:
        name: ST_Test_tefusion
        uses: .gitcode/workflows/st_action.yml
        with:
          st_type: 'tefusion'
          st_package: 'coverage_st_*.info'
          image_version: ${{ jobs.JOB_image.outputs.ST_Test_tefusion }}

      JOB_ST_Test_ge_common_atc:
        name: ST_Test_ge_common_atc
        uses: .gitcode/workflows/st_action.yml
        with:
          st_type: 'ge_common_atc'
          st_package: 'coverage_st_*.info'
          image_version: ${{ jobs.JOB_image.outputs.ST_Test_ge_common }}

    pre:
      - type: auto
    fail-fast: false

  stage4:
    name: LLT_Report
    select: selected_by_default
    jobs:
      JOB_UT_Report_graphengine:
        name: UT_Report_graphengine
        select: selected_by_default
        needs: []
        steps:
          -
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              token: ${{secrets.GIT_TOKEN}}
          -
            name: download
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              key: |
                ${{ env.obs_path }}/pr_filelist.txt
                ${{ env.obs_path }}/pr_filelist_mod.txt
              path: ${{ steps.process_checkout.outputs.path }}
          -
            name: UT_Report
            identifier: ut-report
            uses: cann/.gitcode/actions/ut-cov-report@master
            with:
              workspace: ${{ steps.process_checkout.outputs.path }}
              cov_mode: "report"
              ut_field: "graphengine"
              modules: "ut_dflow ut_ge_common ut_parser ut_rt ut_acl"
              source_branch: ${{ env.SOURCE_BRANCH }}
              target_branch: ${{ env.TARGET_BRANCH }}
              obs_path: ${{ env.obs_path }}
              git_token: ${{secrets.GIT_TOKEN}}
          -
            name: upload
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{secrets.AK}}
              secret-key: ${{secrets.SK}}
              artifact-path: |
                ${{ steps.process_checkout.outputs.path }}/ut_cov_*.tar.gz
              object-prefix: ${{ env.obs_path }}/
        if: env.TARGET_BRANCH == 'master'
        runs-on: [dedicate-hosted, x64, small]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ jobs.JOB_image.outputs.UT_Test_Report }}
      JOB_UT_Report_ge_executor_c:
        name: UT_Report_ge_executor_c
        select: selected_by_default
